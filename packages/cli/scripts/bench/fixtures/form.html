<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Teamspace — create your profile</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1a1a1a; }
  header { background: #7a2e2e; color: #fff; padding: 14px 24px; font-weight: 600; }
  main { max-width: 560px; margin: 32px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #dfe3e8; border-radius: 8px; padding: 24px; }
  .steps { display: flex; gap: 12px; font-size: 13px; color: #666; margin-bottom: 16px; }
  .steps .current { color: #7a2e2e; font-weight: 600; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input[type=text], input[type=email], select { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 15px; border: 1px solid #b9c0c8; border-radius: 6px; }
  fieldset { border: 1px solid #dfe3e8; border-radius: 6px; padding: 10px 14px; margin: 14px 0; }
  legend { font-weight: 600; }
  fieldset label { font-weight: 400; margin: 6px 0; }
  .actions { display: flex; justify-content: space-between; margin-top: 20px; }
  button { font: inherit; padding: 10px 18px; border-radius: 6px; border: 1px solid #7a2e2e; background: #7a2e2e; color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: #7a2e2e; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .error { color: #b3261e; margin-top: 8px; }
  dl { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; }
  dt { color: #666; }
</style>
</head>
<body>
<header>Teamspace</header>
<main>
  <div class="card">
    <div class="steps"><span id="s1" class="current">1 Account</span><span id="s2">2 Preferences</span><span id="s3">3 Review</span></div>

    <form id="step1">
      <h1 style="margin:0 0 6px;font-size:20px">Create your profile</h1>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" required autocomplete="off">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required autocomplete="off">
      <p class="error" id="err1" hidden>Enter your name and a valid email address.</p>
      <div class="actions"><span></span><button type="submit">Next</button></div>
    </form>

    <form id="step2" hidden>
      <label for="country">Country</label>
      <select id="country" name="country" required>
        <option value="">Choose a country…</option>
        <option>Austria</option><option>Canada</option><option>France</option><option>Germany</option>
        <option>India</option><option>Switzerland</option><option>United Kingdom</option><option>United States</option>
      </select>
      <fieldset>
        <legend>Plan</legend>
        <label><input type="radio" name="plan" value="Free"> Free</label>
        <label><input type="radio" name="plan" value="Pro"> Pro</label>
        <label><input type="radio" name="plan" value="Team"> Team</label>
      </fieldset>
      <label style="font-weight:400"><input type="checkbox" id="newsletter" name="newsletter"> Subscribe to the newsletter</label>
      <p class="error" id="err2" hidden>Choose a country and a plan.</p>
      <div class="actions"><button type="button" class="secondary" id="back2">Back</button><button type="submit">Review</button></div>
    </form>

    <section id="step3" hidden>
      <h2 style="margin-top:0">Review</h2>
      <dl id="review"></dl>
      <div class="actions"><button type="button" class="secondary" id="back3">Back</button><button type="button" id="create" disabled>Create profile</button></div>
    </section>

    <section id="done" hidden aria-live="polite">
      <h2 style="margin-top:0">Profile created</h2>
      <p>Welcome aboard! Here is what we saved:</p>
      <dl id="saved"></dl>
    </section>
  </div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const data = {};
  function show(step) {
    for (const s of ["step1", "step2", "step3"]) $(s).hidden = s !== step;
    for (const [i, s] of ["s1", "s2", "s3"].entries()) $(s).classList.toggle("current", `step${i + 1}` === step);
  }
  const valid = () => data.name && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email || "") && data.country && data.plan;
  const rows = () => [["Full name", data.name], ["Email", data.email], ["Country", data.country], ["Plan", data.plan], ["Newsletter", data.newsletter ? "yes" : "no"]]
    .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");

  $("step1").addEventListener("submit", (e) => {
    e.preventDefault();
    data.name = $("name").value.trim();
    data.email = $("email").value.trim();
    const ok = data.name && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email);
    $("err1").hidden = !!ok;
    if (ok) show("step2");
  });
  $("step2").addEventListener("submit", (e) => {
    e.preventDefault();
    data.country = $("country").value;
    data.plan = (document.querySelector('input[name=plan]:checked') || {}).value;
    data.newsletter = $("newsletter").checked;
    const ok = data.country && data.plan;
    $("err2").hidden = !!ok;
    if (!ok) return;
    $("review").innerHTML = rows();
    $("create").disabled = !valid();
    show("step3");
  });
  $("back2").addEventListener("click", () => show("step1"));
  $("back3").addEventListener("click", () => show("step2"));
  $("create").addEventListener("click", () => {
    if (!valid()) return;
    $("saved").innerHTML = rows();
    for (const s of ["step1", "step2", "step3"]) $(s).hidden = true;
    $("done").hidden = false;
    document.title = "Profile created — Teamspace";
  });
})();
</script>
</body>
</html>
