name: release

# Fully automated, changeset-driven — no manual tags (see docs/RELEASING.md).
#
# Push changesets to main → this opens a "Version Packages" PR. Merge that PR →
# this publishes @karnstack/reins to npm, tags + GitHub-releases it, and (once
# the Chrome Web Store secrets exist) uploads the extension zip to the store.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # create tags + GitHub releases
  pull-requests: write # open the Version Packages PR
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Web Store steps run only once these secrets are set (after the first
      # manual store upload, which is what assigns the extension its ID).
      HAS_CWS: ${{ secrets.CWS_REFRESH_TOKEN != '' && secrets.CWS_EXTENSION_ID != '' }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: jdx/mise-action@v4.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Version or publish (changesets)
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Package the extension
        if: steps.changesets.outputs.published == 'true'
        id: zip
        run: |
          pnpm zip
          echo "path=$(ls packages/extension/release/*.zip)" >> "$GITHUB_OUTPUT"

      # The extension is `linked` (not `fixed`) to the CLI, so CLI-only
      # releases leave its version untouched. Re-uploading a version the store
      # already has would fail the API call — and every upload triggers manual
      # review (debugger permission), so skip when there is nothing new.
      - name: Check whether the store needs this version
        if: steps.changesets.outputs.published == 'true' && env.HAS_CWS == 'true'
        id: store
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          local=$(jq -r .version packages/extension/package.json)
          token=$(curl -sf https://oauth2.googleapis.com/token \
            -d "client_id=${CWS_CLIENT_ID}&client_secret=${CWS_CLIENT_SECRET}&refresh_token=${CWS_REFRESH_TOKEN}&grant_type=refresh_token" \
            | jq -r .access_token)
          store=$(curl -sf -H "Authorization: Bearer ${token}" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${CWS_EXTENSION_ID}?projection=DRAFT" \
            | jq -r .crxVersion)
          echo "extension v${local} locally, v${store} on the store"
          if [ "$local" = "$store" ]; then
            echo "store is current — skipping upload"
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      # Upload + publish via the v1.1 API directly (not a marketplace action) so
      # a rejection prints the store's actual response instead of a bare
      # "HTTPError: 400". A failed publish leaves the upload as a draft: fix
      # the cause in the dashboard and submit there — a re-run would see the
      # draft version and skip.
      - name: Upload extension to the Chrome Web Store
        if: steps.store.outputs.upload == 'true'
        env:
          ZIP: ${{ steps.zip.outputs.path }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          api=https://www.googleapis.com/chromewebstore/v1.1/items/${CWS_EXTENSION_ID}
          token=$(curl -sf https://oauth2.googleapis.com/token \
            -d "client_id=${CWS_CLIENT_ID}&client_secret=${CWS_CLIENT_SECRET}&refresh_token=${CWS_REFRESH_TOKEN}&grant_type=refresh_token" \
            | jq -r .access_token)
          echo "::add-mask::${token}"

          # $1 = what failed, $2 = response file. One annotation line with the
          # store's reason, full body in the log.
          fail() {
            reason=$(jq -r '[.error.message?, (.itemError[]?.error_detail), (.statusDetail[]?)] | map(select(. != null and . != "")) | join(" / ")' "$2" 2>/dev/null)
            echo "::error title=Chrome Web Store ${1} failed::${reason:-$(head -c 500 "$2")}"
            exit 1
          }

          echo "uploading ${ZIP}"
          code=$(curl -sS -o upload.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${token}" -H "x-goog-api-version: 2" \
            -T "${ZIP}" "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${CWS_EXTENSION_ID}")
          echo "HTTP ${code}"; jq . upload.json 2>/dev/null || cat upload.json
          if [ "$code" != 200 ] || [ "$(jq -r .uploadState upload.json)" != SUCCESS ]; then
            fail upload upload.json
          fi

          echo "publishing"
          code=$(curl -sS -o publish.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${token}" -H "x-goog-api-version: 2" -H "Content-Length: 0" \
            "${api}/publish")
          echo "HTTP ${code}"; jq . publish.json 2>/dev/null || cat publish.json
          # status is a list: OK, or codes like ITEM_PENDING_REVIEW (an older
          # version is still in review) with the explanation in statusDetail.
          if [ "$code" != 200 ] || ! jq -e '.status | index("OK")' publish.json >/dev/null; then
            fail publish publish.json
          fi
